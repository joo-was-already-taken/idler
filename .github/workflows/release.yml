name: Release Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract Version from build.gradle
        id: versioning
        run: |
          VERSION=$(sed -n "s/.*versionName *= *['\"]\([^'\"]*\)['\"].*/\1/p" build.gradle | head -n 1)
          echo "tag_name=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=Release v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Align and Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"

          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          ( umask 077 && echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE" )

          "$BUILD_TOOLS/zipalign" -v -p 4 \
            build/outputs/apk/release/idler-release-unsigned.apk \
            build/outputs/apk/release/idler-release-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out build/outputs/apk/release/idler-release.apk \
            build/outputs/apk/release/idler-release-aligned.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: ${{ steps.versioning.outputs.release_name }}
          files: build/outputs/apk/release/idler-release.apk
          generate_release_notes: true
