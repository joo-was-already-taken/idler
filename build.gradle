plugins {
    id 'com.android.application' version '9.5.1'
    id 'eclipse'
}

eclipse {
    jdt {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    classpath {
        file {
            whenMerged { classpath ->
                if (!classpath.entries.any { it instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder && it.path == 'src/main/java' }) {
                    classpath.entries.add(new org.gradle.plugins.ide.eclipse.model.SourceFolder('src/main/java', null))
                }
                classpath.entries.removeAll { it instanceof org.gradle.plugins.ide.eclipse.model.Container }
                classpath.entries.add(new org.gradle.plugins.ide.eclipse.model.Container('org.eclipse.jdt.launching.JRE_CONTAINER/org.eclipse.jdt.internal.debug.ui.launcher.StandardVMType/JavaSE-17/'))
                classpath.entries.removeAll { it instanceof org.gradle.plugins.ide.eclipse.model.Library }
                def androidJar = '.android-sdk/platforms/android-36/android.jar'
                if (file(androidJar).exists()) {
                    classpath.entries.add(new org.gradle.plugins.ide.eclipse.model.Library(fileReference(androidJar)))
                }
                def rJar = 'build/intermediates/compile_and_runtime_r_class_jar/debug/processDebugResources/R.jar'
                if (file(rJar).exists()) {
                    classpath.entries.add(new org.gradle.plugins.ide.eclipse.model.Library(fileReference(rJar)))
                }
            }
        }
    }
}

android {
    namespace = 'io.github.joowasalreadytaken.idler'

    compileSdk = 36
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId = 'io.github.joowasalreadytaken.idler'
        minSdk = 34
        targetSdk = 36
        versionCode = 2
        versionName = '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled = true
                shrinkResources = true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
