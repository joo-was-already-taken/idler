    compileSdk = 36

    defaultConfig {
        applicationId = 'io.github.joowasalreadytaken.idler'
        minSdk = 34
        targetSdk = 36
        versionCode = 1
        versionName = '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled = true
                shrinkResources = true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
